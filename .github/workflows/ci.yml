name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: make FLUTTER=flutter DART=dart check
      - run: make DART=dart pigeon-check
      - run: flutter build apk --debug
        timeout-minutes: 5
        working-directory: example
      - run: ./gradlew :secure_content:testDebugUnitTest :secure_content:lintDebug
        working-directory: example/android
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 2
        with:
          name: android-native-test-results
          path: |
            example/build/secure_content/test-results/testDebugUnitTest
            example/build/secure_content/reports/lint-results-debug.*
          if-no-files-found: warn

  ios:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: swift test --package-path ios
      - run: flutter build ios --simulator --no-codesign
        timeout-minutes: 5
        working-directory: example
      - run: ./scripts/test_ios.sh
        timeout-minutes: 10
      - name: Export simulator screenshots
        if: always()
        timeout-minutes: 2
        run: |
          if [[ -f "$RUNNER_TEMP/secure-content-ios-tests.xcresult/Info.plist" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/secure-content-ios-tests.xcresult" \
              --output-path "$RUNNER_TEMP/secure-content-ios-screenshots"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 2
        with:
          name: ios-runtime-test-results
          path: ${{ runner.temp }}/secure-content-ios-tests.xcresult
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 2
        with:
          name: ios-runtime-screenshots
          path: ${{ runner.temp }}/secure-content-ios-screenshots
          if-no-files-found: warn
