name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: make check FLUTTER=flutter DART=dart
      - run: flutter build apk --debug
        timeout-minutes: 5
        working-directory: example
      - run: ./gradlew :secure_content:testDebugUnitTest
        working-directory: example/android

  ios:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: swift test --package-path ios
      - run: flutter build ios --simulator --no-codesign
        timeout-minutes: 5
        working-directory: example
      - run: ./scripts/test_ios.sh
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: ios-runtime-test-results
          path: ${{ runner.temp }}/secure-content-ios-tests.xcresult
          if-no-files-found: warn
