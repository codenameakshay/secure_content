name: secure_content
description: Protect Flutter screens from screenshots, screen recording visibility, and app switcher previews on Android and iOS.
version: 2.0.0
homepage: https://www.hashstudios.in
repository: https://github.com/codenameakshay/secure_content

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.codenameakshay.secure_content
        pluginClass: SecureContentPlugin
      ios:
        pluginClass: SecureContentPlugin
