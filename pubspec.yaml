name: secure_content
description: Protect Flutter screens with screenshot/recording shielding, biometric re-auth, inactivity lock, integrity checks, risk watermarks, and secure clipboard controls.
version: 2.0.0-beta.3
homepage: https://www.hashstudios.in
repository: https://github.com/codenameakshay/secure_content

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.codenameakshay.secure_content
        pluginClass: SecureContentPlugin
      ios:
        pluginClass: SecureContentPlugin
